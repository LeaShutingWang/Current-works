services:
  - type: web
    name: resume-project-extractor
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 24
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4.1-mini
      - key: APP_PASSWORD
        sync: false
      - key: HOST
        value: 0.0.0.0
